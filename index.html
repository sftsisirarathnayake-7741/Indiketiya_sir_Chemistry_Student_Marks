<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemistry Indiketiya Student Portal - Marks & Progress Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  .grade-A { color: #15803d; font-weight: 700; }
  .grade-B { color: #1d4ed8; font-weight: 700; }
  .grade-C { color: #0f766e; font-weight: 700; }
  .grade-S { color: #c2410c; font-weight: 700; }
  .grade-F { color: #b91c1c; font-weight: 700; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

<header class="bg-emerald-900 text-white shadow-lg sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div class="flex items-center space-x-3">
      <i class="fa-solid fa-flask-vial text-3xl text-emerald-300"></i>
      <div>
        <h1 class="text-xl font-bold tracking-wide">Chemistry Indiketiya Student Portal</h1>
        <p class="text-[10px] text-emerald-200 font-semibold uppercase tracking-wider">Marks & Progress Tracker</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <select id="classBranch" onchange="switchBranch()" class="bg-emerald-800 text-white border border-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold outline-none">
        <option value="Matara">Matara Branch</option>
        <option value="Tangalle">Tangalle Branch</option>
      </select>
      <select id="classBatch" onchange="switchBranch()" class="bg-emerald-800 text-white border border-emerald-700 px-3 py-1.5 rounded-lg text-xs font-semibold outline-none">
        <option value="A/L2027">A/L 2027</option>
        <option value="A/L2028">A/L 2028</option>
      </select>
      <button onclick="fetchFromCloud()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold transition shadow">
        <i class="fa-solid fa-rotate"></i> Refresh
      </button>
    </div>
  </div>
</header>

<div class="max-w-4xl mx-auto px-4 mt-8 space-y-6">
  <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
    <h2 class="text-lg font-bold text-slate-800 mb-2 flex items-center gap-2">
      <i class="fa-solid fa-magnifying-glass text-emerald-600"></i> Student Lookup
    </h2>
    <p class="text-xs text-slate-500 mb-4">ලකුණු සහ ප්‍රගති සටහන නැරඹීමට ඔබගේ Student ID එක ඇතුළත් කරන්න (උදා: M2710).</p>
    
    <div class="flex flex-col sm:flex-row gap-3">
      <input type="text" id="searchId" placeholder="Student ID (e.g. M2710)" onkeydown="if(event.key==='Enter')searchStudent()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-500 uppercase font-bold">
      <button id="searchBtn" onclick="searchStudent()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-6 py-3 rounded-xl transition shadow flex items-center justify-center gap-2">
        <i class="fa-solid fa-search"></i> Search
      </button>
    </div>
  </div>

  <div id="studentResultsContainer" class="hidden space-y-6">
    <div id="studentDetailsCard" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200"></div>
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-chart-line text-emerald-600"></i> Progress Graph
      </h2>
      <div class="relative w-full max-h-[350px]">
        <canvas id="studentProgressChart"></canvas>
      </div>
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <h2 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-list-check text-emerald-600"></i> Test Records
      </h2>
      <div id="marksList" class="space-y-3"></div>
    </div>
  </div>

  <div id="emptyState" class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm">
    <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-3 text-emerald-600">
      <i class="fa-solid fa-user-graduate text-2xl"></i>
    </div>
    <h3 class="text-md font-bold text-slate-800">No Student Selected</h3>
    <p class="text-xs text-slate-500 mt-1">තොරතුරු නැරඹීමට ඉහත Student ID එක ඇතුළත් කරන්න.</p>
  </div>
</div>

<script>
// මෙතැනට ඔයාගේ Apps Script Web App URL එක දෙන්න (අපි කලින් හදපු Code.gs එක ඩිප්ලෝයි කරපු ලින්ක් එක)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1jDO99mFRu2entfVYaKS5FsOge6_1r7Cydx0KmBEU4nNYRRYio7JFnEuWaClvuqulgw/exec";

let currentBranch = "Matara";
let currentBatch = "A/L2027";
let chartInstance = null;

function fetchFromCloud() {
  // Refresh button: search again for the same Student ID
  const currentSearch = document.getElementById("searchId").value.trim();
  if (currentSearch) searchStudent();
}

function getLevel(mark) {
  if (mark === "Absent" || mark === null || mark === undefined || mark === "") return "F";
  mark = Number(mark);
  if (mark >= 75) return "A";
  if (mark >= 65) return "B";
  if (mark >= 55) return "C";
  if (mark >= 35) return "S";
  return "F";
}

function parseTestNum(str) {
  if (!str) return 0;
  let num = parseInt(str.toString().replace(/[^0-9]/g, ''));
  return isNaN(num) ? 0 : num;
}

function switchBranch() {
  currentBranch = document.getElementById("classBranch").value;
  currentBatch = document.getElementById("classBatch").value;
  resetSearch();
}

function setSearching(on) {
  const btn = document.getElementById("searchBtn");
  btn.disabled = on;
  btn.innerHTML = on
    ? '<i class="fa-solid fa-spinner fa-spin"></i> Searching...'
    : '<i class="fa-solid fa-search"></i> Search';
}

async function searchStudent() {
  const searchId = document.getElementById("searchId").value.trim().toUpperCase();
  const resultsContainer = document.getElementById("studentResultsContainer");
  const emptyState = document.getElementById("emptyState");

  if (!searchId) {
    alert("කරුණාකර නිවැරදි Student ID එකක් ඇතුළත් කරන්න.");
    return;
  }

  setSearching(true);
  let filtered = [];
  try {
    const url = `${SCRIPT_URL}?action=studentLookup&branch=${encodeURIComponent(currentBranch)}&batch=${encodeURIComponent(currentBatch)}&id=${encodeURIComponent(searchId)}`;
    const res = await fetch(url);
    const result = await res.json();
    if (!result || result.status !== "success") throw new Error(result ? result.message : "Error");
    filtered = result.records || [];
  } catch (e) {
    console.error("Cloud Error:", e);
    alert("දත්ත ලබා ගැනීමට නොහැකි විය. Internet සම්බන්ධතාවය පරීක්ෂා කර නැවත උත්සාහ කරන්න.");
    return;
  } finally {
    setSearching(false);
  }

  if (filtered.length === 0) {
    emptyState.classList.remove("hidden");
    resultsContainer.classList.add("hidden");
    alert(`${searchId} සඳහා දත්ත හමු වූයේ නැත.`);
    return;
  }

  emptyState.classList.add("hidden");
  resultsContainer.classList.remove("hidden");

  filtered.sort((a,b) => parseTestNum(a.week) - parseTestNum(b.week));

  let totalMarks = 0;
  let validTestsCount = 0;
  let studentName = filtered[0].name || "N/A";
  let school = (filtered.find(x => x.school) || {}).school || "";

  filtered.forEach(item => {
    if (typeof item.marks === "number") {
      totalMarks += item.marks;
      validTestsCount++;
    }
  });

  let avg = validTestsCount > 0 ? (totalMarks / validTestsCount).toFixed(1) : "0.0";

  document.getElementById("studentDetailsCard").innerHTML = `
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h2 class="text-xl font-bold text-slate-800">${escapeHTML(studentName)}</h2>
        <p class="text-xs text-slate-500 font-semibold mt-0.5">ID: <span class="text-emerald-800 font-bold">${escapeHTML(searchId)}</span> | Branch: <span class="text-emerald-600 font-bold">${currentBranch} (${currentBatch})</span></p>
        ${school ? `<p class="text-xs text-slate-500 font-semibold mt-0.5">School: <span class="text-slate-700 font-bold">${escapeHTML(school)}</span></p>` : ""}
      </div>
      <div class="flex gap-3">
        <div class="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-center">
          <p class="text-[10px] text-slate-500 font-bold uppercase">Tests Written</p>
          <p class="text-lg font-extrabold text-slate-800">${validTestsCount}</p>
        </div>
        <div class="bg-emerald-50 border border-emerald-100 p-2.5 rounded-xl text-center">
          <p class="text-[10px] text-emerald-800 font-bold uppercase">Average</p>
          <p class="text-lg font-extrabold text-emerald-700">${avg}</p>
        </div>
      </div>
    </div>
  `;

  let listHtml = "";
  filtered.forEach(item => {
    let markVal = item.marks === "Absent" ? "Absent" : `${item.marks} Marks`;
    let rankVal = item.rank ? `#${item.rank}` : '-';
    listHtml += `
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs shadow-sm">
        <div>
          <span class="font-bold text-slate-800 text-sm">${escapeHTML(item.week)}</span>
          <span class="ml-2 grade-${getLevel(item.marks)}">(${getLevel(item.marks)})</span>
        </div>
        <div class="text-right">
          <span class="font-bold text-slate-800 text-sm">${markVal}</span>
          <span class="ml-3 text-slate-500 font-bold bg-white px-2 py-1 rounded border border-slate-200">Rank: ${rankVal}</span>
        </div>
      </div>`;
  });
  document.getElementById("marksList").innerHTML = listHtml;
  renderChart(filtered);
}

function renderChart(studentData) {
  const ctx = document.getElementById("studentProgressChart").getContext("2d");
  const labels = studentData.map(x => x.week);
  const marks = studentData.map(x => (x.marks === "Absent" ? 0 : x.marks));

  if (chartInstance) {
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Marks",
        data: marks,
        borderColor: "#16a34a",
        backgroundColor: "rgba(22, 163, 74, 0.1)",
        borderWidth: 3,
        pointBackgroundColor: "#14532d",
        pointRadius: 5,
        fill: true,
        tension: 0.3
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { min: 0, max: 100, ticks: { stepSize: 20 } }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}

function resetSearch() {
  document.getElementById("searchId").value = "";
  document.getElementById("studentResultsContainer").classList.add("hidden");
  document.getElementById("emptyState").classList.remove("hidden");
}

function escapeHTML(text) {
  return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

</script>
</body>
</html>
